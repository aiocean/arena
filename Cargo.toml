[workspace]
resolver = "3"
members = ["crates/*"]
# arena-duel-py needs pyo3 and is built only by maturin for the trainer: its own workspace
exclude = ["crates/arena-duel-py"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# The damage system, a crate of the arena's own
arena-calc = { path = "crates/arena-calc" }
libm = "0.2"
# Every hit test of the rules (`arena_calc::collide`): f64, libm and scalar maths, so a page and the server agree
parry2d-f64 = { version = "=0.31.1", default-features = false, features = ["required-features", "std", "enhanced-determinism"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

# Frame time first, as in the engine: opt-level 3, fat LTO in one codegen unit.
[profile.release]
lto = "fat"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
disallowed_methods = "deny"

# Debug and test builds keep line tables only: backtraces still name file and line, and a clone's target/ is about
# half the size (several clones build side by side on the kiosk, whose disk runs short). Release and web are untouched.
[profile.dev]
debug = "line-tables-only"

# The machinery that runs bots (wasmtime's compiler, tract's kernels) optimised in test builds too: a bot module of
# the house AI's size compiles and plays in seconds instead of minutes.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
# The picture codecs the wiki's test reads the sheets and writes its pictures with (crates/arena-wiki)
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.libwebp-sys]
opt-level = 3

# The game for the browser (site/build.sh): small over fast, as a page loads it. Measured with wasm-opt -Oz after:
# "z" 21.2 MB (8.7 MB gzipped), "s" 24.0 MB. Not stripped here: wasm-bindgen reads the features section; wasm-opt
# strips after it.
[profile.web]
inherits = "release"
opt-level = "z"
panic = "abort"
