[package]
name = "pixfx-duel-py"
description = "The landing duel's training environments for Python: many duels stepped in a batch on worker threads"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "pixfx_duel"
crate-type = ["cdylib"]

[dependencies]
# a bot: an ONNX policy run natively, or a bot module
arena-bot = { path = "../arena-bot", features = ["host", "onnx"] }
numpy = "0.30"
pixfx-duel = { path = "../pixfx-duel" }
# the effect registry the page has: some duel rules play only when their effect is there
# the same engine rev as the root Cargo.toml's [workspace.dependencies]
pixfx-effects = { git = "https://github.com/aiocean/pixfx-rs", rev = "2b9db8ebcedafb0559a903d2c80a92c7860588d6" }
pixfx-mind = { git = "https://github.com/aiocean/pixfx-rs", rev = "2b9db8ebcedafb0559a903d2c80a92c7860588d6" }
pyo3 = { version = "0.30", features = ["extension-module"] }

# pyo3 stays out of the main workspace (like pixfx-gpui): it is built only by `maturin` for the trainer
[workspace]

[profile.release]
lto = "fat"
codegen-units = 1

[lints.rust]
# pyo3's macros emit `unsafe` blocks marked `allow`, which `forbid` would refuse; this crate's own code has none
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
