[package]
name = "arena-link"
description = "The live-match link: a running match as postcard frames (a self-contained snapshot, then each corner's decisions) carried over MoQ/WebTransport. Pure: the message types and their encoding, shared by the server that fights and the page that watches."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arena-mind = { path = "../arena-mind", features = ["serde"] }
serde = { workspace = true }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }

[lints]
workspace = true
