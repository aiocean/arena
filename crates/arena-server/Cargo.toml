[package]
name = "arena-server"
description = "Fights matches and publishes them live: the rules, the house AI (ONNX, natively) and a built-in mind on a fixed tick, each corner's decisions written as arena-link frames onto a MoQ track (a Cloudflare relay over WebTransport), so every watching page replays the same fight from its seed. The server opens no port and needs no fixed address."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "arena_server"
path = "src/lib.rs"

[[bin]]
name = "arena-server"
path = "src/main.rs"

[[bin]]
name = "arena-watch"
path = "src/bin/watch.rs"

[dependencies]
arena-link = { path = "../arena-link" }
arena-duel = { path = "../arena-duel" }
arena-mind = { path = "../arena-mind" }
# the house AI's seat: its ONNX policy run natively through tract, measured by the bot meter (bot.end, runtime onnx)
arena-bot = { path = "../arena-bot", features = ["onnx"] }
moq-net = "0.3.23"
moq-tokio = "0.19.37"
tokio = { version = "1.48", features = ["macros", "rt", "rt-multi-thread", "time", "signal", "sync"] }
anyhow = "1"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# telemetry: init, and the duel observer on each match (ops/telemetry/README.md)
arena-telemetry = { path = "../arena-telemetry" }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.48", features = ["test-util"] }
