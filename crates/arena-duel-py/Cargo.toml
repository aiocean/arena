[package]
name = "arena-duel-py"
description = "The landing duel's training environments for Python: many duels stepped in a batch on worker threads"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "arena_duel"
crate-type = ["cdylib"]

[dependencies]
# a bot: an ONNX policy, run natively (no wasm host: a module is checked with arena-bot's `check`, not trained against)
arena-bot = { path = "../arena-bot", features = ["onnx"] }
numpy = "0.30"
arena-duel = { path = "../arena-duel" }
arena-mind = { path = "../arena-mind" }
pyo3 = { version = "0.30", features = ["extension-module"] }

# pyo3 stays out of the main workspace (like pixfx-gpui): it is built only by `maturin` for the trainer
[workspace]

[profile.release]
lto = "fat"
codegen-units = 1

[lints.rust]
# pyo3's macros emit `unsafe` blocks marked `allow`, which `forbid` would refuse; this crate's own code has none
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
