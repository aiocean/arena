[package]
name = "pixfx-duel"
description = "The landing duel's rules: two cultivators, their skills, bars, statuses and rounds, deterministic from a seed"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libm.workspace = true
pixfx-draw.workspace = true
pixfx-fighter.workspace = true
pixfx-mind.workspace = true
serde = { workspace = true, optional = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
# the whole effect registry, as the page has it, and which effects loop
pixfx-effects.workspace = true
# exact float parsing and the fixture's key order
serde_json = { version = "=1.0.154", features = ["float_roundtrip", "preserve_order"] }

[features]
# serde for the commands, events and views, in the shapes JS reads them (camelCase, tagged with "type")
serde = ["dep:serde", "pixfx-mind/serde", "pixfx-fighter/serde"]
# TypeScript declarations for the wasm bindings
ts = ["serde", "pixfx-mind/ts", "pixfx-fighter/ts", "dep:tsify", "dep:wasm-bindgen"]

[lints]
workspace = true
