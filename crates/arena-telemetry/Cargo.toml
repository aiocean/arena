[package]
name = "arena-telemetry"
description = "The arena's telemetry: tracing to stderr and, when ARENA_OTLP_ENDPOINT is set, OpenTelemetry logs, traces and metrics over OTLP/HTTP into the central OpenObserve; and the duel observer, which turns what a duel step returns into structured events without touching the fight"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tracing = "0.1"
# the exporting pipeline (`init`): off at run time unless an endpoint is configured
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "registry", "fmt", "std"] }
opentelemetry = { version = "0.33", optional = true }
opentelemetry_sdk = { version = "0.33", optional = true }
opentelemetry-otlp = { version = "0.33", optional = true }
opentelemetry-appender-tracing = { version = "0.33", optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }
# the duel observer reads a step's events and the duel's state
arena-duel = { path = "../arena-duel", optional = true }
arena-calc = { workspace = true, optional = true }

[features]
default = ["otlp", "duel"]
otlp = [
    "dep:tracing-subscriber", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp",
    "dep:opentelemetry-appender-tracing", "dep:tracing-opentelemetry",
]
duel = ["dep:arena-duel", "dep:arena-calc"]

[[example]]
name = "observe"
required-features = ["otlp", "duel"]

[lints]
workspace = true

[dev-dependencies]
# the query example: SQL against OpenObserve's search API
ureq = { version = "3", default-features = false, features = ["json"] }
serde_json.workspace = true
# the observer's test listens to every event
tracing-subscriber = { version = "0.3", features = ["registry"] }

[[example]]
name = "query"

[[test]]
name = "observer"
required-features = ["duel"]
