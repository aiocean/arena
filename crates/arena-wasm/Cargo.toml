[package]
name = "arena-wasm"
description = "The arena's duel for JavaScript: `Duel`, the trained `Policy` or bot module a corner seats, the rules' tables the page reads, and the `Fighters` drawn from the arena's sprite sheets"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# admission only: the page runs the module itself
arena-bot = { path = "../arena-bot" }
arena-fighter = { path = "../arena-fighter" }
arena-vfx = { path = "../arena-vfx" }
js-sys.workspace = true
pixfx-duel = { path = "../pixfx-duel", features = ["serde"] }
pixfx-core.workspace = true
pixfx-draw.workspace = true
pixfx-fighter = { workspace = true, features = ["serde"] }
pixfx-mind = { workspace = true, features = ["ts"] }
serde.workspace = true
serde-wasm-bindgen.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
wasm-bindgen.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]

[lints]
workspace = true
