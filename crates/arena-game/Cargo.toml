[package]
name = "arena-game"
description = "The arena's duel as a Bevy game: the rules on a fixed tick, the fighters from their sprite sheets, the spells as particles, the HUD, and the bots in each corner, natively and in the browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "arena"
path = "src/main.rs"

[dependencies]
arena-mind = { path = "../arena-mind" }
# a live match on the wire (postcard frames), shared with the server that fights it
arena-link = { path = "../arena-link" }
# the damage system: the pool's skills (names, the motion each borrows) for the HUD
arena-calc.workspace = true
arena-vfx = { path = "../arena-vfx" }
# only what the game uses (no 3D, scenes, picking, gizmos, post-processing, audio): the page loads less
bevy = { version = "0.20", default-features = false, features = [
    "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log", "bevy_window", "bevy_winit", "x11",
    "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_sprite_render", "bevy_ui", "bevy_ui_render",
    "bevy_text", "default_font", "png", "webp", "webgl2",
] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
arena-duel = { path = "../arena-duel" }
serde = { workspace = true }
serde_json = { workspace = true }

# natively, a corner's bot runs in wasmtime and the house AI from its ONNX model
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arena-bot = { path = "../arena-bot", features = ["host", "onnx"] }

# in the browser, a corner's bot is a WebAssembly module the page instantiates
[target.'cfg(target_arch = "wasm32")'.dependencies]
arena-bot = { path = "../arena-bot" }
js-sys = "0.3"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "UrlSearchParams", "History", "Document", "Element", "HtmlElement", "Response", "console"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
# watching live matches: MoQ over the browser's WebTransport (needs `--cfg=web_sys_unstable_apis`, .cargo/config.toml);
# web-transport-wasm 0.6 is the last on the transport trait moq-net 0.3 takes
moq-net = "0.3.23"
web-transport-wasm = "=0.6.0"
url = "2"
# moq-net's rand draws on getrandom 0.4, which needs its browser backend named too
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

# the offline review shots draw their labels (examples/hitbox_review.rs)
[dev-dependencies]
ab_glyph = "0.2"

[lints]
workspace = true
