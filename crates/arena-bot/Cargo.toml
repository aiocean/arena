[package]
name = "arena-bot"
description = "A bot as a WebAssembly module (the arena-bot-3 ABI): admit one (validate, meter, hash) and, with `host`, run it in a duel seat"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sha2 = "0.11"
wasm-encoder = { version = "0.263", features = ["wasmparser"] }
wasmparser = "0.263"
# the host: wasmtime, and the seat the duel asks
arena-duel = { path = "../arena-duel", optional = true }
arena-mind = { path = "../arena-mind", optional = true }
wasmtime = { version = "50", optional = true, default-features = false, features = ["cranelift", "runtime", "std"] }
# the host's think time, fuel and faults as events (arena-telemetry exports them when configured; nothing otherwise)
tracing = { version = "0.1", optional = true }
# an ONNX policy run natively (the house AI in the ladder and the tests, a trainer's opponents)
tract-onnx = { version = "0.22", optional = true, default-features = false }

[dev-dependencies]
# the check: the fixed observations
serde_json = { workspace = true, features = ["float_roundtrip", "preserve_order"] }
wat = "1"
# the ladder's --telemetry-dir: its rows and per-skill tables as lines in the telemetry files
arena-telemetry = { path = "../arena-telemetry", default-features = false, features = ["export"] }
tracing = "0.1"
# the telemetry test's subscriber: what bot.end carries
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[features]
host = ["dep:arena-duel", "dep:arena-mind", "dep:wasmtime", "dep:tracing"]
onnx = ["dep:arena-duel", "dep:arena-mind", "dep:tract-onnx", "dep:tracing"]
# the trace example: every tick as JSON, the rules' serde shapes
trace = ["onnx", "arena-duel/serde"]

[[example]]
name = "check"
required-features = ["host"]

[[example]]
name = "ladder"
required-features = ["host", "onnx"]

[[example]]
name = "match"
required-features = ["host", "onnx"]

[[example]]
name = "whiff"
required-features = ["host", "onnx"]

[[example]]
name = "damage"
required-features = ["host", "onnx"]

[[example]]
name = "trace"
required-features = ["trace"]

[lints]
workspace = true
